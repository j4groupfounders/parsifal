name: Tox

on:
  pull_request:
    branches:
    - master
    - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        cache: "pip"
    - name: Set up Postgres
      run: |
        sudo apt-get update
        sudo apt-get -y install postgresql postgresql-contrib
        sudo service postgresql start
        sudo su - postgres -c "createuser richardwagner"
        sudo su - postgres -c "psql -c \"ALTER USER richardwagner WITH PASSWORD 'holygrail';\""
        sudo su - postgres -c "psql -c \"ALTER USER richardwagner WITH SUPERUSER;\""
        sudo su - postgres -c "createdb --owner richardwagner parsifal"
    - name: Set up Tox
      run: |
        python -m pip install --upgrade pip
        pip install "tox<4"
    - name: Run Tox
      run: tox
    - name: Boot check (J4)
      run: |
        python -m venv /tmp/bootenv && . /tmp/bootenv/bin/activate
        pip install -q -r requirements/tests.txt
        python manage.py migrate -v0 --settings=parsifal.settings.tests
        python manage.py runserver 127.0.0.1:8000 --settings=parsifal.settings.tests --noreload > boot.log 2>&1 &
        for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8000/ && break; sleep 1; done
        for p in / /login/ /signup/ /about/ /blog/ /help/ /sitemap.xml /robots.txt /reviews/ /logout/; do
          curl -s -o /dev/null -w "GET $p -> %{http_code}\n" "http://127.0.0.1:8000$p"
        done
        test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/login/)" = "200"
        tail -5 boot.log
